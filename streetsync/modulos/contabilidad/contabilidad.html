<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Módulo de Contabilidad</title>
  <link rel="stylesheet" href="estilos_contabilidad.css?v=2" />
  <link rel="icon" href="../../../imagenes/logo-transparent.png" type="image/png" />
</head>
<body>

  <a href="../modulos.html" class="btn-volver">&#8592;</a>

  <header class="logo-top">
    <img src="../../../imagenes/logo-transparent.png" alt="Logo StreetSync" />
    <h1>Gestión Contable</h1>
  </header>

  <main>
    <div class="modulos-grid">
      <div class="modulo-card">
        <div class="modulo-texto">

          <div class="search-form">
            <input type="text" id="inputBuscar" class="search-input" placeholder="Buscar movimiento..." />
            <div class="botones-form">
              <button type="button" class="btn-buscar" id="btnBuscar">Actualizar</button>
              <button type="button" class="btn-agregar" id="abrirModalAgregar">Agregar Movimiento</button>
            </div>
          </div>

          <div class="search-form" style="margin-top:1rem;">
            <label for="selectMes" style="color:#ccc;">Mes:</label>
            <select id="selectMes" class="search-input" style="width:auto;padding:0.4rem;">
              <option value="1">Enero</option><option value="2">Febrero</option>
              <option value="3">Marzo</option><option value="4">Abril</option>
              <option value="5">Mayo</option><option value="6">Junio</option>
              <option value="7">Julio</option><option value="8">Agosto</option>
              <option value="9">Septiembre</option><option value="10">Octubre</option>
              <option value="11">Noviembre</option><option value="12">Diciembre</option>
            </select>
            <label for="selectAnio" style="color:#ccc;">Año:</label>
            <select id="selectAnio" class="search-input" style="width:auto;padding:0.4rem;">
              <option value="2023">2023</option><option value="2024">2024</option>
              <option value="2025" selected>2025</option><option value="2026">2026</option>
            </select>
            <button type="button" class="btn-agregar" id="btnVerReporte">Ver Reporte</button>
          </div>

          <div class="clientes-list" id="tabla-container"></div>

        </div>
      </div>
    </div>
  </main>

  <footer class="logo-top">
    <img src="../../../imagenes/logo-transparent.png" alt="Logo StreetSync Footer" />
  </footer>

  <!-- Modal Agregar Movimiento -->
  <div id="modalAgregar" class="modal">
    <div class="modal-content">
      <span class="close modal-cerrar">&times;</span>
      <h3>Agregar Movimiento</h3>
      <form id="formAgregarMovimiento">
        <input type="date" name="fecha" required />
        <select name="tipo" required>
          <option value="" disabled selected>Tipo de movimiento</option>
          <option value="Ingreso">Ingreso</option>
          <option value="Egreso">Egreso</option>
        </select>
        <input type="text" name="concepto" placeholder="Concepto" required />
        <input type="number" step="0.01" name="monto" placeholder="Monto" required />
        <button type="submit" class="btn-agregar">Agregar</button>
      </form>
    </div>
  </div>

  <!-- Modal Mensaje -->
  <div id="modalMensaje" class="modal">
    <div class="modal-content">
      <span class="close" id="cerrarModalMensaje">&times;</span>
      <h3 id="mensajeTexto"></h3>
    </div>
  </div>

  <!-- Modal Editar Movimiento -->
  <div id="modalEditar" class="modal">
    <div class="modal-content">
      <span class="close" id="cerrarModalEditar">&times;</span>
      <h3>Editar Movimiento</h3>
      <form id="formEditarMovimiento">
        <input type="hidden" id="editMovimientoId" />
        <input type="date" id="editFecha" required />
        <select id="editTipo" required>
          <option value="Ingreso">Ingreso</option>
          <option value="Egreso">Egreso</option>
        </select>
        <input type="text" id="editConcepto" placeholder="Concepto" required />
        <input type="number" step="0.01" id="editMonto" placeholder="Monto" required />
        <button type="submit" class="btn-agregar">Guardar Cambios</button>
      </form>
    </div>
  </div>

  <!-- Modal Confirmar Eliminar -->
  <div id="modalConfirmarEliminar" class="modal">
    <div class="modal-content">
      <span class="close" id="cerrarModalConfirmarEliminar">&times;</span>
      <h3>¿Eliminar este movimiento?</h3>
      <p>Esta acción no se puede deshacer.</p>
      <div style="display:flex;justify-content:center;gap:1rem;margin-top:1.5rem;">
        <button id="btnCancelarEliminar" class="btn-modal-cancelar">Cancelar</button>
        <button id="btnConfirmarEliminar" class="btn-modal-eliminar">Eliminar</button>
      </div>
    </div>
  </div>

  <script src="animaciones_contabilidad.js?v=2"></script>
</body>
</html>
